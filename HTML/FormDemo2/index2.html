<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Summit Registration</title>
    <style>
        /* Clean layout without using <br> tags */
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.25rem;
        }
        fieldset {
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            padding: 1rem;
        }
        .radio-group label {
            display: inline-block;
            margin-right: 1rem;
        }
    </style>
</head>
<body>

<!-- Changed method to POST for secure data handling -->
<form action="/register" method="post">

    <!-- Explicit labels connected via 'for' attribute -->
    <div class="form-group">
        <label Fil="rep-name">Representative Name</label>
        <input type="text" name="rep_name" id="rep-name" maxlength="20" minlength="1" required>
    </div>

    <div class="form-group">
        <label for="gal-comm">Galactic Communications</label>
        <input type="email" name="gal_comm" id="gal-comm" maxlength="100">
    </div>

    <div class="form-group">
        <label for="crew-size">Crew Size Attending</label>
        <input type="number" name="crew_size" id="crew-size" min="1" max="8">
    </div>

    <!-- Semantic fieldset for grouping radio buttons -->
    <fieldset>
        <legend>Alliance</legend>
        <div class="radio-group">
            <label for="star-wars">
                <input type="radio" name="alliance" id="star-wars" value="starwars"> Star Wars
            </label>
            <label for="star-trek">
                <input type="radio" name="alliance" id="star-trek" value="startrek"> Star Trek
            </label>
            <label for="snacks">
                <input type="radio" name="alliance" id="snacks" value="snacks"> Snacks
            </label>
        </div>
    </fieldset>

    <div class="form-group">
        <label for="updates">
            <input type="checkbox" name="updates" id="updates" checked> Summit Updates
        </label>
    </div>

    <div class="form-actions">
        <button type="reset">Reset</button>
        <button type="submit">Submit</button>
    </div>

</form>

</body>
</html>
